name: Feature Pipeline

# Manual dispatch for agent-driven feature branches.
# Also runs automatically on PRs to provide a quality gate.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Feature branch to validate
        required: true
        type: string
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Gate 1 — Typecheck
  # ─────────────────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  # ─────────────────────────────────────────────────────────────────────────
  # Gate 2 — Lint
  # ─────────────────────────────────────────────────────────────────────────
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

  # ─────────────────────────────────────────────────────────────────────────
  # Gate 3 — Tests + Coverage
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────
  # Gate 4 — Build
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [typecheck, lint, test]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci
          BETTER_AUTH_SECRET: ci-placeholder-secret-at-least-32-characters-long
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          AI_PROVIDER: gemini
          GEMINI_API_KEY: ci-placeholder-not-a-real-key

  # ─────────────────────────────────────────────────────────────────────────
  # Gate 5 — Security scan
  # ─────────────────────────────────────────────────────────────────────────
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────
  # Summary — all gates must pass before merge
  # ─────────────────────────────────────────────────────────────────────────
  pipeline-status:
    name: Pipeline Status
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test, build, security]
    if: always()
    steps:
      - name: Check all gates
        run: |
          echo "TypeScript: ${{ needs.typecheck.result }}"
          echo "ESLint:     ${{ needs.lint.result }}"
          echo "Tests:      ${{ needs.test.result }}"
          echo "Build:      ${{ needs.build.result }}"
          echo "Security:   ${{ needs.security.result }}"

          if [[ "${{ needs.typecheck.result }}" != "success" ]] || \
             [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "PIPELINE FAILED — one or more required gates did not pass."
            exit 1
          fi

          echo "PIPELINE PASSED — all required gates green."
