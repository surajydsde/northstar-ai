name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs strictly from the lockfile. It is what caught that
      # @langchain/* were resolving from a parent directory rather than being
      # declared dependencies.
      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      # Build needs the server env schema to validate. These are throwaway CI
      # values, not secrets: no real provider is called during a build.
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci
          BETTER_AUTH_SECRET: ci-placeholder-secret-at-least-32-characters-long
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          AI_PROVIDER: gemini
          GEMINI_API_KEY: ci-placeholder-not-a-real-key

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Advisory: the known findings are dev-only (drizzle-kit -> esbuild), and
      # the available fix is a breaking downgrade. Reported, not gating.
      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true

      # Fails the build if a real secret was committed. This repository has had
      # uploads and env files in awkward places before.
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
